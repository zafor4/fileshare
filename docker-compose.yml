services:
  postgres:
    image: postgres:16-alpine
    container_name: fileshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fileshare
      POSTGRES_PASSWORD: fileshare
      POSTGRES_DB: fileshare
    ports:
      - "5432:5432"
    volumes:
      - fileshare_pg:/var/lib/postgresql/data

volumes:
  fileshare_pg:
